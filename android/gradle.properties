org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Djava.net.preferIPv4Stack=true
android.useAndroidX=true
# Fix "Gradle threw an error while downloading artifacts from the network":
# IPv6 to Maven Central / Gradle Plugin Portal (Cloudflare) is broken on this
# network (curl -6 fails fast, curl default times out 20-30s, curl -4 works).
# Force Gradle daemon + workers onto IPv4 and raise HTTP timeouts so slow
# downloads retry instead of hanging then failing after ~26min.
systemProp.java.net.preferIPv4Stack=true
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000

[package]
name = "rust_lib_burrow"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
# `rlib` is required for the `tests/` integration tests to link the crate.
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
# OCF container. Only the deflate codec is enabled: EPUBs use stored/deflate,
# and this keeps the pure-Rust (MIT/Apache) backend instead of zopfli/zlib-rs.
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# OPF/container/Nav XML.
quick-xml = "0.42"
# Plain-text chapter splitting (`txt`): Dart-`RegExp` heading/blank-run
# patterns. MIT/Apache-2.0, allowed by `deny.toml`.
regex = "1"
# XHTML byte decoding: honours the XML/HTML encoding declaration (windows-1252,
# UTF-16 without a BOM, …) instead of assuming UTF-8. Apache-2.0/MIT.
encoding_rs = "0.8"
# NFC normalisation for archive keys: macOS-produced EPUBs store NFD names
# while their hrefs are NFC (or vice versa). MIT/Apache-2.0.
unicode-normalization = "0.1"
# Browser-grade XHTML parsing with HTML5 error recovery (G1/D5). The `dom`
# module lowers the result into our own block tree; the RcDom is never exposed.
# `markup5ever_rcdom` 0.39 must stay in lockstep with `html5ever` 0.39 — both
# are built against `markup5ever` 0.39, and a newer html5ever (0.40) expects a
# different `markup5ever`, so the two would not type-check together.
html5ever = "0.39"
markup5ever_rcdom = "0.39"
# CSS tokenising (`cssparser`) and selector matching (`selectors`). Both are
# MPL-2.0 — file-level copyleft — which `deny.toml` allows as long as their
# sources are unmodified (design D5/§6). `selectors` 0.41 and `cssparser` 0.38
# are the versions that share one `cssparser` API; `precomputed-hash` supplies
# the `PrecomputedHash` bound our selector-impl newtype must satisfy.
cssparser = "0.38"
selectors = "0.41"
precomputed-hash = "0.1"
# RAR listing/extraction for CBR comics (Task 3): pure-Rust Apache-2.0 backend,
# allowed by `deny.toml`; no UnRAR licence involved.
rars = "0.10.2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
